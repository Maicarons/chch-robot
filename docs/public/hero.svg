<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="CH-RO Robot Team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="504" height="404" rx="30" fill="url(#bg)"/>

  <!-- board grid -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2">
    <line x1="70" y1="55" x2="70" y2="300"/>
    <line x1="118" y1="55" x2="118" y2="300"/>
    <line x1="166" y1="55" x2="166" y2="300"/>
    <line x1="214" y1="55" x2="214" y2="300"/>
    <line x1="262" y1="55" x2="262" y2="300"/>
    <line x1="310" y1="55" x2="310" y2="300"/>
    <line x1="358" y1="55" x2="358" y2="300"/>
    <line x1="406" y1="55" x2="406" y2="300"/>
    <line x1="454" y1="55" x2="454" y2="300"/>
    <line x1="70" y1="55" x2="454" y2="55"/>
    <line x1="70" y1="92" x2="454" y2="92"/>
    <line x1="70" y1="129" x2="454" y2="129"/>
    <line x1="70" y1="166" x2="454" y2="166"/>
    <line x1="70" y1="203" x2="454" y2="203"/>
    <line x1="70" y1="240" x2="454" y2="240"/>
    <line x1="70" y1="277" x2="454" y2="277"/>
    <line x1="70" y1="300" x2="454" y2="300"/>
  </g>

  <!-- palace diagonals -->
  <g stroke="#ffffff" stroke-opacity="0.78" stroke-width="2">
    <line x1="214" y1="55" x2="310" y2="129"/>
    <line x1="310" y1="55" x2="214" y2="129"/>
    <line x1="214" y1="240" x2="310" y2="300"/>
    <line x1="310" y1="240" x2="214" y2="300"/>
  </g>

  <!-- center piece -->
  <circle cx="262" cy="177" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="262" y="188" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" fill="#0f172a">帅</text>

  <!-- robot arm -->
  <g fill="none" stroke="url(#arm)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="430" cy="60" r="18" fill="#ffffff" stroke="none"/>
    <path d="M430 60 L430 130 L262 135"/>
  </g>
  <!-- gripper -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="262" y1="135" x2="246" y2="154"/>
    <line x1="262" y1="135" x2="278" y2="154"/>
  </g>

  <!-- wordmark -->
  <text x="260" y="362" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="3" fill="#ffffff">CH-RO</text>
  <text x="260" y="392" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" letter-spacing="6" fill="#ffffff" fill-opacity="0.88">ROBOT TEAM</text>
</svg>
